{% extends "base.html" %}
{% block title %}Delete Employee{% endblock %}
{% block content %}
<div class="card card-shadow p-4 text-center">
    <h4>Delete {{ object.full_name }}?</h4>
    <p class="text-muted">This action cannot be undone.</p>
    <form method="post">
        
        <div class="d-flex justify-content-center gap-2">
            <a href="{{ url('employees:list') }}" class="btn btn-outline-secondary">Cancel</a>
            <button class="btn btn-danger" type="submit">Delete</button>
        </div>
    </form>
</div>
{% endblock %}
